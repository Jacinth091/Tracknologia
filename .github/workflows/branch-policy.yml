name: Branch Policy

on:
  pull_request:
    branches:
      - "feature/**"
      - "release/**"
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate:
    name: Branch Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch policy
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate promotion path
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash scripts/check-branch-policy.sh "$BASE_BRANCH" "$HEAD_BRANCH"
