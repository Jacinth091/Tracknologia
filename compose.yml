name: tracknologia

services:
  web:
    build:
      context: .
      target: development

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      WATCHPACK_POLLING: "true"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

    command: pnpm dev

volumes:
  node_modules:
  pnpm_store:
