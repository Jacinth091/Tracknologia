<!--
  Supabase Auth "Confirm signup" email. Supabase sends it, not the app.
  Local: wired in supabase/config.toml. Hosted projects: paste this into
  Authentication -> Emails -> Confirm signup (see docs/SETUP.md).
  Keep {{ .ConfirmationURL }}; brand colors mirror src/app/globals.css.
-->
<div
  style="
    background-color: #faf8f3;
    padding: 32px 16px;
    font-family:
      Figtree,
      -apple-system,
      &quot;Segoe UI&quot;,
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    color: #141414;
  "
>
  <div style="max-width: 560px; margin: 0 auto">
    <p
      style="
        margin: 0 0 20px 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #141414;
      "
    >
      Tracknologia<span style="color: #ffc72c">.</span>
    </p>

    <div
      style="
        background-color: #ffffff;
        border: 1px solid #e9e4d8;
        border-radius: 10px;
        padding: 28px 24px;
      "
    >
      <h1
        style="
          margin: 0 0 12px 0;
          font-size: 20px;
          font-weight: 700;
          color: #141414;
        "
      >
        Confirm your email
      </h1>
      <p
        style="
          margin: 0 0 24px 0;
          font-size: 15px;
          line-height: 1.6;
          color: #45403a;
        "
      >
        Thanks for signing up for Tracknologia. Confirm this email address to
        finish creating your account.
      </p>

      <a
        href="{{ .ConfirmationURL }}"
        style="
          display: inline-block;
          background-color: #ffc72c;
          color: #141414;
          padding: 12px 24px;
          border-radius: 10px;
          text-decoration: none;
          font-size: 15px;
          font-weight: 600;
        "
      >
        Confirm email
      </a>
    </div>

    <p
      style="
        margin: 20px 4px 0 4px;
        font-size: 12px;
        line-height: 1.5;
        color: #6b6455;
      "
    >
      This link works once and expires soon. If you did not sign up for
      Tracknologia, you can ignore this email.
    </p>
  </div>
</div>
